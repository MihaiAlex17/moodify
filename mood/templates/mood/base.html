<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Moodify{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #f5f5f0;
      --white:     #ffffff;
      --border:    #d8d8d0;
      --accent:    #2d7a4f;
      --accent-hover: #245f3e;
      --text:      #1a1a1a;
      --muted:     #666660;
      --error:     #c0392b;
      --success:   #27ae60;
      --sad:       #2980b9;
      --chill:     #8e44ad;
      --happy:     #e67e22;
      --radius:    6px;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-size: 15px;
      line-height: 1.6;
    }

    /* ── Navbar ── */
    nav {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 0 1.5rem;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav-brand {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
      text-decoration: none;
      letter-spacing: -0.02em;
    }
    .nav-links { display: flex; gap: 0.25rem; align-items: center; }
    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      padding: 0.35rem 0.75rem;
      border-radius: var(--radius);
      font-size: 0.9rem;
      transition: color 0.15s, background 0.15s;
    }
    .nav-links a:hover { color: var(--text); background: #eeeeea; }
    .nav-links .nav-username {
      color: var(--text);
      font-weight: 600;
      font-size: 0.9rem;
    }
    .nav-links .btn-logout {
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .nav-links .btn-logout:hover { color: var(--error); border-color: var(--error); background: #fdf2f0; }

    /* ── Main content ── */
    main { flex: 1; padding: 2rem 1.5rem; max-width: 800px; margin: 0 auto; width: 100%; }

    /* ── Cards ── */
    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.75rem;
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.6rem 1.25rem;
      border-radius: var(--radius);
      border: 1px solid transparent;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      text-decoration: none;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .btn-secondary {
      background: var(--white);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: #eeeeea; }
    .btn-spotify {
      background: #1db954;
      color: #fff;
      font-size: 0.82rem;
      padding: 0.35rem 0.85rem;
      border-radius: 4px;
    }
    .btn-spotify:hover { background: #19a349; }

    /* ── Form inputs ── */
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.88rem; font-weight: 500; color: var(--text); margin-bottom: 0.35rem; }
    .form-group input,
    .form-group textarea {
      width: 100%;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      padding: 0.6rem 0.85rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(45,122,79,0.12);
    }
    .form-group textarea { resize: vertical; min-height: 110px; }
    .form-error { color: var(--error); font-size: 0.83rem; margin-top: 0.25rem; }

    /* ── Mood badges ── */
    .mood-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.2rem 0.7rem;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .mood-sad      { background: #eaf3fb; color: var(--sad);   border: 1px solid #b8d8ef; }
    .mood-chillout { background: #f3eaf8; color: var(--chill); border: 1px solid #d8b8ef; }
    .mood-happy    { background: #fdf0e3; color: var(--happy); border: 1px solid #f0d0a0; }

    /* ── Messages ── */
    .messages { margin-bottom: 1.25rem; }
    .message { padding: 0.75rem 1rem; border-radius: var(--radius); font-size: 0.9rem; margin-bottom: 0.5rem; }
    .message.error   { background: #fdf2f0; color: var(--error); border: 1px solid #e8c0bb; }
    .message.success { background: #f0f8f3; color: var(--success); border: 1px solid #b0d8bb; }

    /* ── Page title ── */
    .page-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.25rem; }
    .page-subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
  {% if user.is_authenticated %}
  <nav>
    <a class="nav-brand" href="/">🎵 Moodify</a>
    <div class="nav-links">
      <a href="/">Acasă</a>
      <a href="/history/">Istoric</a>
      <a href="/search/">Caută</a>
      <a href="/profile/" class="nav-username">{{ user.username }}</a>
      <a class="btn-logout" href="/logout/">Ieșire</a>
    </div>
  </nav>
  {% endif %}

  <main>
    {% if messages %}
    <div class="messages">
      {% for msg in messages %}
      <div class="message {{ msg.tags }}">{{ msg }}</div>
      {% endfor %}
    </div>
    {% endif %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
