<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Moodify{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0a12;
      --surface:   #13131f;
      --card:      #1c1c2e;
      --border:    rgba(139,92,246,0.18);
      --p1:        #7c3aed;
      --p2:        #a855f7;
      --p3:        #c084fc;
      --cyan:      #22d3ee;
      --text:      #f0f0ff;
      --muted:     #8888aa;
      --sad:       #3b82f6;
      --chill:     #a855f7;
      --happy:     #f59e0b;
      --radius:    14px;
      --shadow:    0 20px 60px rgba(0,0,0,0.6);
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Navbar ── */
    nav {
      background: rgba(19,19,31,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-brand {
      font-size: 1.4rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--p2), var(--cyan));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-decoration: none;
    }
    .nav-links { display: flex; gap: 0.5rem; align-items: center; }
    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      padding: 0.4rem 0.9rem;
      border-radius: 8px;
      font-size: 0.92rem;
      transition: color 0.2s, background 0.2s;
    }
    .nav-links a:hover { color: var(--text); background: rgba(139,92,246,0.12); }
    .nav-links .btn-logout {
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .nav-links .btn-logout:hover { color: #f87171; border-color: #f87171; background: rgba(248,113,113,0.08); }

    /* ── Main content ── */
    main { flex: 1; padding: 2.5rem 1.5rem; max-width: 860px; margin: 0 auto; width: 100%; }

    /* ── Cards ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      box-shadow: var(--shadow);
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.7rem 1.6rem;
      border-radius: 10px;
      border: none;
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--p1), var(--p2));
      color: #fff;
      box-shadow: 0 4px 20px rgba(124,58,237,0.4);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(124,58,237,0.55); }
    .btn-secondary {
      background: rgba(139,92,246,0.1);
      color: var(--p3);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: rgba(139,92,246,0.2); }
    .btn-spotify {
      background: #1db954;
      color: #fff;
      font-size: 0.85rem;
      padding: 0.45rem 1rem;
      border-radius: 999px;
    }
    .btn-spotify:hover { background: #1ed760; transform: translateY(-1px); }

    /* ── Form inputs ── */
    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; font-size: 0.88rem; color: var(--muted); margin-bottom: 0.4rem; }
    .form-group input, .form-group textarea {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      padding: 0.75rem 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-group input:focus, .form-group textarea:focus {
      border-color: var(--p2);
      box-shadow: 0 0 0 3px rgba(168,85,247,0.15);
    }
    .form-group textarea { resize: vertical; min-height: 110px; }
    .form-error { color: #f87171; font-size: 0.83rem; margin-top: 0.3rem; }

    /* ── Mood badges ── */
    .mood-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.3rem 0.9rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .mood-sad     { background: rgba(59,130,246,0.15); color: var(--sad);   border: 1px solid rgba(59,130,246,0.3); }
    .mood-chillout{ background: rgba(168,85,247,0.15); color: var(--chill); border: 1px solid rgba(168,85,247,0.3); }
    .mood-happy   { background: rgba(245,158,11,0.15); color: var(--happy); border: 1px solid rgba(245,158,11,0.3); }

    /* ── Messages ── */
    .messages { margin-bottom: 1rem; }
    .message { padding: 0.8rem 1rem; border-radius: 8px; font-size: 0.9rem; }
    .message.error   { background: rgba(248,113,113,0.1); color: #f87171; border: 1px solid rgba(248,113,113,0.2); }
    .message.success { background: rgba(16,185,129,0.1);  color: #34d399; border: 1px solid rgba(16,185,129,0.2); }

    /* ── Fade-in animation ── */
    @keyframes fadeUp { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
    .fade-up { animation: fadeUp 0.45s ease both; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--p1); border-radius: 3px; }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
  {% if user.is_authenticated %}
  <nav>
    <a class="nav-brand" href="/">🎵 Moodify</a>
    <div class="nav-links">
      <a href="/">Acasă</a>
      <a href="/history/">Istoric</a>
      <a href="/search/">Caută 🔍</a>
      <a href="/profile/" style="color:var(--text);font-size:0.92rem;padding:0 0.5rem;text-decoration:none;font-weight:600;">{{ user.username }}</a>
      <a class="btn-logout" href="/logout/">Ieșire</a>
    </div>
  </nav>
  {% endif %}

  <main>
    {% if messages %}
    <div class="messages">
      {% for msg in messages %}
      <div class="message {{ msg.tags }}">{{ msg }}</div>
      {% endfor %}
    </div>
    {% endif %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
