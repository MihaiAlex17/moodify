{% extends "mood/base.html" %}
{% block title %}Link invalid — Moodify{% endblock %}
{% block extra_css %}
<style>
  main { display:flex; justify-content:center; align-items:center; }
  .info-card { max-width:460px; width:100%; text-align:center; }
  .big-icon { font-size:3.5rem; margin-bottom:1rem; }
  h1 { font-size:1.8rem; font-weight:700; margin-bottom:0.6rem; }
  p  { color:var(--muted); line-height:1.7; }
</style>
{% endblock %}
{% block content %}
<div class="info-card card fade-up">
  <div class="big-icon">❌</div>
  <h1>Link invalid</h1>
  <p>{{ reason }}</p>
  <a class="btn btn-secondary" href="/register/" style="margin-top:1.5rem;display:inline-flex;">
    Înregistrează-te din nou
  </a>
</div>
{% endblock %}
